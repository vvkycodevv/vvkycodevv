<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 132" width="840" height="132" role="img" aria-label="XPGym — turns your training into an RPG — live on the App Store">
  <title>XPGym — live on the App Store</title>
  <style>
    text{font-family:ui-monospace,'Cascadia Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .inx{opacity:0;animation:fin .7s ease-out .15s forwards}
    @keyframes fin{to{opacity:1}}
    .dot{transform-box:fill-box;transform-origin:50% 50%;animation:dp 2s ease-in-out infinite}
    @keyframes dp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}
    .shine{animation:sweep 4.2s ease-in-out infinite}
    @keyframes sweep{0%,55%{transform:translateX(-70px) skewX(-20deg)}80%,100%{transform:translateX(300px) skewX(-20deg)}}
  </style>
  <defs>
    <linearGradient id="ig" gradientUnits="userSpaceOnUse" x1="26" y1="26" x2="106" y2="106">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <clipPath id="icClip"><rect x="26" y="26" width="80" height="80" rx="18"/></clipPath>
    <clipPath id="pc"><rect x="600" y="46" width="214" height="40" rx="20"/></clipPath>
  </defs>

  <rect x="1" y="1" width="838" height="130" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <g class="inx">
    <!-- app icon -->
    <rect x="26" y="26" width="80" height="80" rx="18" fill="url(#ig)"/>
    <path transform="translate(50 44)" d="M18 0 L0 26 L10 26 L6 44 L26 16 L15 16 L20 0 Z" fill="#ffffff" opacity=".95"/>
    <image x="26" y="26" width="80" height="80" clip-path="url(#icClip)" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
    <rect x="26" y="26" width="80" height="80" rx="18" fill="none" stroke="#30363d" stroke-width="1"/>

    <!-- status + name + one-liner -->
    <circle class="dot" cx="136" cy="43" r="4" fill="#3ECF8E"/>
    <text x="148" y="47" font-size="11" letter-spacing="2" fill="#8b949e">LIVE ON THE APP STORE</text>
    <text x="130" y="78" font-size="21" font-weight="700" fill="#e6edf3">XPGym</text>
    <text x="130" y="102" font-size="13.5" fill="#8b949e">turns your training into an RPG — every set earns XP</text>

    <!-- download pill -->
    <rect x="600" y="46" width="214" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <g clip-path="url(#pc)">
      <rect class="shine" x="620" y="36" width="46" height="60" fill="#ffffff" opacity=".06"/>
    </g>
    <text x="707" y="71" text-anchor="middle" font-size="12.5" fill="#e6edf3">Download on the App Store</text>
  </g>
</svg>
